<!DOCTYPE html>
<html lang=\"en\">
<head>
<meta charset=\"UTF-8\">
<title>Branch Sales Map Scenario</title>
<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
html, body { height: 100%; width: 100%; background: #e5f0ff; }

body {
    background: radial-gradient(circle at top left, #fee2e2, #e0f2fe);
}

.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px 18px;
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.top-title {
    font-size: 1.3rem;
    font-weight: 600;
    background: linear-gradient(45deg, #ef4444, #2563eb);
    -webkit-background-clip: text;
    color: transparent;
}

.top-actions {
    display: flex;
    gap: 8px;
}

.btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
}

.btn-primary {
    background: linear-gradient(120deg, #2563eb, #ef4444);
    color: white;
}
.btn-outline {
    background: white;
    color: #111827;
    border: 1px solid #d1d5db;
}

/* GRID LAYOUT */
.main-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1.2fr 1.8fr;
    grid-template-rows: auto 1fr;
    gap: 10px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(16px);
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid rgba(148,163,184,0.35);
}

.card h4 {
    margin-bottom: 6px;
    font-size: 0.9rem;
    background: linear-gradient(45deg, #ef4444, #2563eb);
    -webkit-background-clip: text;
    color: transparent;
}

/* KPI STRIP */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 8px;
}

.kpi {
    background: rgba(255,255,255,0.95);
    border-radius: 10px;
    padding: 8px 10px;
    border: 1px solid rgba(148,163,184,0.35);
}

.kpi-label {
    font-size: 0.75rem;
    color: #6b7280;
}
.kpi-value {
    margin-top: 4px;
    font-size: 1.0rem;
    font-weight: 600;
    color: #111827;
}

/* CHARTS ROW */
.charts-row {
    display: grid;
    grid-template-columns: 1.2fr 1.2fr;
    gap: 10px;
}

/* MAP GRID */
.map-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    grid-auto-rows: 80px;
    gap: 8px;
    margin-top: 4px;
}

.region-tile {
    border-radius: 12px;
    padding: 6px 8px;
    color: #111827;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 0.8rem;
}

.region-name {
    font-weight: 600;
}
.region-value {
    font-size: 0.9rem;
}

/* CANVAS */
canvas {
    width: 100% !important;
    height: 240px !important;
}
</style>
</head>
<body>
<div class=\"container\">
    <div class=\"top-bar\">
        <div class=\"top-title\" id=\"dashTitle\">Branch Sales Map Scenario</div>
        <div class=\"top-actions\">
            <button class=\"btn btn-outline\" onclick=\"backToMenu()\">Back to Menu</button>
            <button class=\"btn btn-primary\" onclick=\"logoutFromDashboard()\">Logout</button>
        </div>
    </div>

    <div class=\"main-grid\">
        <!-- TOP: KEY METRICS -->
        <div class=\"card\" style=\"grid-column: 1 / span 2;\">
            <h4>Key Metrics</h4>
            <div class=\"kpi-grid\">
                <div class=\"kpi\">
                    <div class=\"kpi-label\">Total Sales (₹ Cr)</div>
                    <div class=\"kpi-value\" id=\"kpiTotal\">-</div>
                </div>
                <div class=\"kpi\">
                    <div class=\"kpi-label\">Avg Sales / Branch (₹ Cr)</div>
                    <div class=\"kpi-value\" id=\"kpiAvg\">-</div>
                </div>
                <div class=\"kpi\">
                    <div class=\"kpi-label\">Branch Count</div>
                    <div class=\"kpi-value\" id=\"kpiBranches\">-</div>
                </div>
                <div class=\"kpi\">
                    <div class=\"kpi-label\">Top Region</div>
                    <div class=\"kpi-value\" id=\"kpiTopRegion\">-</div>
                </div>
            </div>
        </div>

        <!-- PIE CHART -->
        <div class=\"card\">
            <h4>Region Share (Pie)</h4>
            <canvas id=\"pieChart\"></canvas>
        </div>

        <!-- BAR CHART -->
        <div class=\"card\">
            <h4>Branch Sales (Bar)</h4>
            <canvas id=\"barChart\"></canvas>
        </div>

        <!-- MAP GRID -->
        <div class=\"card\" style=\"grid-column: 1 / span 2;\">
            <h4>India Region Map (Sales Intensity)</h4>
            <div class=\"map-grid\" id=\"mapGrid\"></div>
        </div>
    </div>
</div>

<script src=\"chart.umd.min.js\"></script>
<script>
let scenarioId = null;
let analysisData = null;
let pieChart = null;
let barChart = null;

function backToMenu() {
    window.location.href = \"index.html\";
}

function logoutFromDashboard() {
    localStorage.clear();
    fetch(\"/api/logout\", { method: \"POST\" }).finally(() => {
        window.location.href = \"index.html\";
    });
}

function initDashboard() {
    const sidStr = localStorage.getItem(\"currentScenarioIdForDashboard\");
    scenarioId = sidStr ? parseInt(sidStr, 10) : null;

    if (!scenarioId) {
        alert(\"Scenario not found. Going back to menu.\");
        backToMenu();
        return;
    }

    const metaStr = localStorage.getItem(\"scenarioMeta_\" + scenarioId);
    if (metaStr) {
        const meta = JSON.parse(metaStr);
        const label = (meta.scenario_code || \"\") + \" - \" + (meta.name || \"\");
        document.getElementById(\"dashTitle\").textContent = label || \"Branch Sales Map Scenario\";
    }

    fetch(\"/api/scenarios/\" + scenarioId + \"/analysis/latest\")
      .then(r => r.json())
      .then(res => {
          if (!res.success) {
              alert(res.message || \"Unable to load analysis\");
              return;
          }
          analysisData = res.analysis || {};
          populateDashboard(analysisData);
      });
}

function populateDashboard(analysis) {
    const km = analysis.key_metrics || {};
    document.getElementById(\"kpiTotal\").textContent = km[\"Total Sales (₹ Cr)\"] ?? \"-\";
    document.getElementById(\"kpiAvg\").textContent = km[\"Avg Sales per Branch (₹ Cr)\"] ?? \"-\";
    document.getElementById(\"kpiBranches\").textContent = km[\"Branch Count\"] ?? \"-\";
    document.getElementById(\"kpiTopRegion\").textContent = km[\"Top Region by Sales\"] ?? \"-\";

    const pieSegs = analysis.pie_segments || [];
    const barSegs = analysis.bar_segments || [];
    const mapRegions = analysis.map_regions || [];

    drawPieChart(pieSegs);
    drawBarChart(barSegs);
    drawMap(mapRegions);
}

function drawPieChart(segments) {
    const ctx = document.getElementById(\"pieChart\").getContext(\"2d\");
    if (pieChart) pieChart.destroy();
    if (!segments.length) return;

    const labels = segments.map(s => s.label);
    const values = segments.map(s => s.value);

    pieChart = new Chart(ctx, {
        type: \"pie\",
        data: {
            labels: labels,
            datasets: [{
                data: values
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: \"bottom\" } }
        }
    });
}

function drawBarChart(segments) {
    const ctx = document.getElementById(\"barChart\").getContext(\"2d\");
    if (barChart) barChart.destroy();
    if (!segments.length) return;

    const labels = segments.map(s => s.label);
    const values = segments.map(s => s.value);

    barChart = new Chart(ctx, {
        type: \"bar\",
        data: {
            labels: labels,
            datasets: [{
                label: \"Sales (₹ Cr)\",
                data: values
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { autoSkip: true, maxRotation: 45, minRotation: 0 } },
                y: { beginAtZero: true }
            }
        }
    });
}

function drawMap(regions) {
    const container = document.getElementById(\"mapGrid\");
    container.innerHTML = \"\";
    if (!regions.length) {
        container.innerHTML = \"<em>No region data.</em>\";
        return;
    }

    const maxVal = Math.max(...regions.map(r => r.total_sales_cr || 0.0)) || 1;

    regions.forEach(r => {
        const ratio = (r.total_sales_cr || 0) / maxVal;
        const bg = `linear-gradient(135deg, rgba(239,68,68,${0.2 + 0.5*ratio}), rgba(37,99,235,${0.2 + 0.5*ratio}))`;

        const tile = document.createElement(\"div\");
        tile.className = \"region-tile\";
        tile.style.background = bg;

        tile.innerHTML = `
            <div class=\"region-name\">${r.region}</div>
            <div class=\"region-value\">₹ ${r.total_sales_cr.toFixed(2)} Cr</div>
        `;
        container.appendChild(tile);
    });
}

document.addEventListener(\"DOMContentLoaded\", initDashboard);
</script>
</body>
</html>
